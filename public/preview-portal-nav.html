<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview · Tabs / nav</title>
  <style>
    :root {
      --portal-navy: #1a164d;
      --portal-ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --portal-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --portal-motion-fast: 150ms;
      --portal-motion-base: 220ms;
      --bg: #f2f2f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: #0f1d2e;
      display: flex;
      flex-direction: column;
    }
    .wrap { max-width: 420px; margin: 0 auto; padding: 24px 20px; width: 100%; flex: 1; }
    h1 { font-size: 18px; font-weight: 800; margin: 0 0 4px; }
    .sub { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    .label { font-size: 12px; font-weight: 700; color: #64748b; margin: 0 0 8px; }

    .portal-nav-indicator {
      transition:
        transform var(--portal-motion-base) var(--portal-ease-in-out),
        opacity var(--portal-motion-fast) var(--portal-ease-out);
    }
    .portal-nav-pill-thumb {
      transition:
        left var(--portal-motion-base) var(--portal-ease-in-out),
        width var(--portal-motion-base) var(--portal-ease-in-out),
        opacity var(--portal-motion-fast) var(--portal-ease-out);
    }

    /* —— Pills Hacienda —— */
    .pills-track {
      position: relative;
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: #e5e5ea;
      width: 100%;
    }
    .pills-track .thumb {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 0;
      z-index: 0;
      border-radius: 999px;
      background: var(--portal-navy);
      box-shadow: 0 4px 12px rgba(26, 22, 77, 0.25);
      opacity: 0;
      pointer-events: none;
    }
    .pills-track button {
      position: relative;
      z-index: 1;
      flex: 1;
      border: 0;
      background: transparent;
      border-radius: 999px;
      padding: 10px 8px;
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      transition: color 200ms ease;
    }
    .pills-track button[aria-current="page"] { color: #fff; }

    /* —— Bottom nav —— */
    .phone {
      margin-top: 28px;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.1);
      overflow: hidden;
      min-height: 280px;
      display: flex;
      flex-direction: column;
    }
    .phone-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
    }
    .bottom-nav {
      position: relative;
      background: #fff;
      border-radius: 1.75rem 1.75rem 0 0;
      box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.08);
      padding-bottom: 8px;
    }
    .grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      height: 72px;
      align-items: center;
      padding: 0 4px;
    }
    .grid .bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 32px;
      height: 4px;
      border-radius: 999px;
      background: var(--portal-navy);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
      height: 100%;
      padding-top: 10px;
      border: 0;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      min-width: 0;
    }
    .tab[aria-current="page"] { color: var(--portal-navy); font-weight: 700; }
    .tab svg { width: 22px; height: 22px; }
    .tab span { font-size: 10px; font-weight: 500; white-space: nowrap; }
    .tab[aria-current="page"] span { font-weight: 700; }
    .fab-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    .fab {
      width: 48px;
      height: 48px;
      margin-top: -36px;
      border-radius: 999px;
      border: 3px solid #fff;
      background: var(--portal-navy);
      color: #fff;
      font-size: 22px;
      font-weight: 300;
      line-height: 1;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Tabs / nav · light</h1>
    <p class="sub">Pastilla e indicador se deslizan al ítem activo (~220 ms). Toca para probar.</p>

    <p class="label">Hacienda · pills</p>
    <div class="pills-track" id="pills">
      <span class="thumb portal-nav-pill-thumb" id="pillThumb"></span>
      <button type="button" data-pill aria-current="page">Visor</button>
      <button type="button" data-pill>Clientes</button>
      <button type="button" data-pill>Proveedores</button>
    </div>

    <div class="phone">
      <div class="phone-body" id="screen">Inicio</div>
      <nav class="bottom-nav" aria-label="Demo">
        <div class="grid" id="grid">
          <span class="bar portal-nav-indicator" id="bar"></span>
          <button type="button" class="tab" data-tab aria-current="page" data-label="Inicio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Inicio</span>
          </button>
          <button type="button" class="tab" data-tab data-label="Declaraciones">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span>Declaraciones</span>
          </button>
          <div class="fab-wrap"><button type="button" class="fab" tabindex="-1" aria-hidden>+</button></div>
          <button type="button" class="tab" data-tab data-label="Honorarios">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/></svg>
            <span>Honorarios</span>
          </button>
          <button type="button" class="tab" data-tab data-label="CFDI">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 14l3-5"/><circle cx="12" cy="14" r="1.25" fill="currentColor" stroke="none"/><path d="M4.5 15.5A8.5 8.5 0 0 1 12 5.5"/><path d="M19.5 15.5A8.5 8.5 0 0 0 12 5.5"/><path d="M6 19h12"/></svg>
            <span>CFDI</span>
          </button>
        </div>
      </nav>
    </div>
  </div>
  <script>
    (function () {
      var BAR_W = 32;
      var pills = document.getElementById("pills");
      var pillThumb = document.getElementById("pillThumb");
      var grid = document.getElementById("grid");
      var bar = document.getElementById("bar");
      var screen = document.getElementById("screen");

      function syncPill() {
        var activo = pills.querySelector('[aria-current="page"]');
        if (!activo) return;
        pillThumb.style.left = activo.offsetLeft + "px";
        pillThumb.style.width = activo.offsetWidth + "px";
        pillThumb.style.opacity = "1";
      }
      function syncBar() {
        var activo = grid.querySelector('.tab[aria-current="page"]');
        if (!activo) return;
        var g = grid.getBoundingClientRect();
        var t = activo.getBoundingClientRect();
        var x = t.left - g.left + (t.width - BAR_W) / 2;
        bar.style.transform = "translateX(" + x + "px)";
        bar.style.opacity = "1";
      }

      pills.onclick = function (e) {
        var btn = e.target.closest("[data-pill]");
        if (!btn || !pills.contains(btn)) return;
        pills.querySelectorAll("[data-pill]").forEach(function (b) {
          b.removeAttribute("aria-current");
        });
        btn.setAttribute("aria-current", "page");
        syncPill();
      };
      grid.onclick = function (e) {
        var btn = e.target.closest("[data-tab]");
        if (!btn || !grid.contains(btn)) return;
        grid.querySelectorAll("[data-tab]").forEach(function (b) {
          b.removeAttribute("aria-current");
        });
        btn.setAttribute("aria-current", "page");
        screen.textContent = btn.getAttribute("data-label");
        syncBar();
      };

      requestAnimationFrame(function () {
        syncPill();
        syncBar();
      });
      window.addEventListener("resize", function () {
        syncPill();
        syncBar();
      });
    })();
  </script>
</body>
</html>
