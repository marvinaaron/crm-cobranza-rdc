<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview · Skeletons portal</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #fff;
      --navy: #0f1d2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--navy);
    }
    header.top {
      padding: 20px 24px 8px;
      max-width: 1100px;
      margin: 0 auto;
    }
    header.top h1 { margin: 0; font-size: 20px; font-weight: 800; }
    header.top p { margin: 6px 0 0; font-size: 13px; color: #64748b; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 24px 40px;
    }
    .col { display: flex; flex-direction: column; gap: 12px; }
    .label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .page { display: flex; flex-direction: column; gap: 16px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
    }
    .bone {
      background: linear-gradient(90deg, #e8edf3 0%, #f4f7fb 45%, #e8edf3 90%);
      background-size: 200% 100%;
      animation: shimmer 1.35s ease-in-out infinite;
      border-radius: 10px;
    }
    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bone { animation: none; background: #e8edf3; }
    }
    .row { display: flex; gap: 12px; }
    .circle { width: 64px; height: 64px; border-radius: 999px; flex-shrink: 0; }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  </style>
</head>
<body>
  <header class="top">
    <h1>Skeletons del portal (paso 1–2)</h1>
    <p>Así se ve la carga de Inicio · Declaraciones · Honorarios. Solo visual; no toca datos.</p>
  </header>
  <div class="grid">
    <div class="col">
      <div class="label">Inicio</div>
      <div class="page">
        <div>
          <div class="bone" style="height:36px;width:72%;margin-bottom:8px"></div>
          <div class="bone" style="height:14px;width:112px"></div>
        </div>
        <div class="card">
          <div class="bone" style="height:14px;width:96px"></div>
          <div class="row">
            <div class="bone circle"></div>
            <div class="bone circle"></div>
            <div class="bone circle"></div>
            <div class="bone circle"></div>
          </div>
        </div>
        <div class="card">
          <div class="bone" style="height:14px;width:112px"></div>
          <div class="bone" style="height:32px;width:144px"></div>
          <div class="bone" style="height:40px;width:100%"></div>
        </div>
        <div class="card">
          <div class="bone" style="height:14px;width:128px"></div>
          <div class="bone" style="height:96px;width:100%"></div>
          <div class="cal">
            <div class="bone" style="height:32px"></div>
            <div class="bone" style="height:32px"></div>
            <div class="bone" style="height:32px"></div>
            <div class="bone" style="height:32px"></div>
            <div class="bone" style="height:32px"></div>
            <div class="bone" style="height:32px"></div>
            <div class="bone" style="height:32px"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="label">Declaraciones</div>
      <div class="page">
        <div>
          <div class="bone" style="height:32px;width:192px;margin-bottom:8px"></div>
          <div class="bone" style="height:14px;width:160px"></div>
        </div>
        <div class="card">
          <div class="bone" style="height:16px;width:144px"></div>
          <div class="bone" style="height:80px;width:100%"></div>
          <div class="bone" style="height:48px;width:100%"></div>
          <div class="bone" style="height:48px;width:100%"></div>
        </div>
        <div class="card">
          <div class="bone" style="height:16px;width:112px"></div>
          <div class="bone" style="height:112px;width:100%"></div>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="label">Honorarios</div>
      <div class="page">
        <div>
          <div class="bone" style="height:32px;width:176px;margin-bottom:8px"></div>
          <div class="bone" style="height:14px;width:208px"></div>
        </div>
        <div class="card">
          <div class="bone" style="height:14px;width:96px"></div>
          <div class="bone" style="height:40px;width:160px"></div>
          <div class="bone" style="height:44px;width:100%"></div>
        </div>
        <div class="card">
          <div class="bone" style="height:16px;width:128px"></div>
          <div class="bone" style="height:56px;width:100%"></div>
          <div class="bone" style="height:56px;width:100%"></div>
          <div class="bone" style="height:56px;width:100%"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
